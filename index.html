<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    #open-video-popup {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 10001;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      padding: 12px 16px;
      background: rgba(8, 16, 28, .88);
      color: #fff;
      font: 600 14px/1 Arial, sans-serif;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0,0,0,.32);
      backdrop-filter: blur(12px);
    }

    #open-video-popup:focus-visible,
    #close-youtube:focus-visible {
      outline: 2px solid #78e7ff;
      outline-offset: 3px;
    }

    #youtube-player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.88);
      box-sizing: border-box;
    }

    #youtube-player.open {
      display: flex;
    }

    #youtube-player .player-card {
      width: min(900px, 100%);
      position: relative;
      background: #000;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    #youtube-player .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
    }

    #close-youtube {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.8);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >

      <!-- Intro video used as a live video texture on AR panel 3. -->
      <video
        id="intro-video"
        src="https://hak3du.github.io/portfolio/intro.mp4"
        crossorigin="anonymous"
        playsinline
        muted
        loop
        preload="auto"
      ></video>

      <img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="5.85"

          height="3.25"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.90"

          width="3.6"

          height="2"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.60"

          width="2.25"

          height="1.25"

          material="
            src: #intro-video;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.30"

          width="4.2"

          height="2.33"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="2.7"

          height="1.5"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity camera>
      <a-entity
        cursor="fuse: false; rayOrigin: entity"
        raycaster="objects: #panel-3; far: 10"
        position="0 0 -1">
      </a-entity>
    </a-entity>


  </a-scene>


  <!-- Separate expanded player; the AR panel keeps playing in place. -->
  <button id="open-video-popup" type="button" aria-haspopup="dialog">⤢ Expand video</button>
  <div id="youtube-player" role="dialog" aria-modal="true" aria-label="Expanded portfolio video">
    <div class="player-card">
      <button id="close-youtube" type="button" aria-label="Close video">×</button>
      <video
        id="popup-video"
        class="video-frame"
        title="Portfolio introduction video"
        src="https://hak3du.github.io/portfolio/intro.mp4"
        playsinline
        controls
        preload="metadata">
      </video>
    </div>
  </div>

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const marker =
      document.querySelector("#marker");

    const status =
      document.querySelector("#status");

    const scene =
      document.querySelector("a-scene");
    const middlePanel =
      document.querySelector("#panel-3");
    const paneVideo =
      document.querySelector("#intro-video");
    const youtubePlayer =
      document.querySelector("#youtube-player");
    const popupVideo =
      document.querySelector("#popup-video");
    const openVideoPopup =
      document.querySelector("#open-video-popup");
    const closeYoutube =
      document.querySelector("#close-youtube");

    async function togglePaneVideo() {
      try {
        if (paneVideo.paused) {
          await paneVideo.play();
          status.innerText = "▶ Intro playing on AR panel";
        } else {
          paneVideo.pause();
          status.innerText = "Intro paused — tap the panel to resume";
        }
      } catch (error) {
        status.innerText = "Video could not load — check the intro.mp4 URL";
        console.error("AR pane video playback failed:", error);
      }
    }

    async function openVideoPopup() {
      youtubePlayer.classList.add("open");
      try {
        if (Number.isFinite(paneVideo.currentTime)) {
          popupVideo.currentTime = paneVideo.currentTime;
        }
        await popupVideo.play();
      } catch (error) {
        status.innerText = "Tap Play in the expanded video window";
        console.error("Expanded video playback failed:", error);
      }
      closeYoutube.focus();
    }

    function closeYoutubePlayer() {
      youtubePlayer.classList.remove("open");
      if (!popupVideo.paused) {
        try { paneVideo.currentTime = popupVideo.currentTime; } catch (_) {}
        popupVideo.pause();
      }
      status.innerText = marker.object3D.visible
        ? "✓ MARKER DETECTED"
        : "Camera ready — scan marker";
    }

    middlePanel.addEventListener("click", togglePaneVideo);
    openVideoPopup.addEventListener("click", openVideoPopup);
    closeYoutube.addEventListener("click", closeYoutubePlayer);
    youtubePlayer.addEventListener("click", function (event) {
      if (event.target === youtubePlayer) closeYoutubePlayer();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && youtubePlayer.classList.contains("open")) {
        closeYoutubePlayer();
      }
    });


    /*
     * A-FRAME LOADED
     */

    scene.addEventListener(
      "loaded",
      function () {

        console.log("A-FRAME LOADED");

        status.innerText =
          "Camera ready — scan marker";

      }
    );


    /*
     * MARKER FOUND
     */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

      }
    );


    /*
     * MARKER LOST
     */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }
    );

  </script>


</body>

</html>
