<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio AR — Video</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #videoPanel {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);

      width: min(90vw, 420px);

      background: rgba(0, 0, 0, 0.85);
      color: white;

      padding: 16px;
      border-radius: 14px;

      text-align: center;

      z-index: 9999;

      display: none;
    }

    #videoPanel button {
      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 8px;

      background: white;
      color: black;

      font-size: 16px;
      cursor: pointer;
    }

    #videoOverlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.96);

      z-index: 10000;

      display: none;
    }

    #youtubeFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    #closeVideo {
      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 10001;

      padding: 12px 18px;

      border: none;
      border-radius: 8px;

      background: white;
      color: black;

      font-size: 16px;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- AR VIDEO BUTTON -->
  <div id="videoPanel">
    <strong>Portfolio AR</strong>

    <br><br>

    <button id="watchVideo">
      ▶ Watch Video
    </button>
  </div>


  <!-- FULLSCREEN YOUTUBE -->
  <div id="videoOverlay">

    <button id="closeVideo">
      ✕ Close
    </button>

    <iframe
      id="youtubeFrame"
      src=""
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>

  </div>


  <!-- AR SCENE -->
  <a-scene
    embedded
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false">

    <!-- MARKER -->

    <a-marker
      id="marker"
      type="pattern"
      url="marker.patt">

    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>

  </a-scene>


  <script>

    const marker = document.querySelector("#marker");

    const videoPanel =
      document.querySelector("#videoPanel");

    const videoOverlay =
      document.querySelector("#videoOverlay");

    const youtubeFrame =
      document.querySelector("#youtubeFrame");

    const watchVideo =
      document.querySelector("#watchVideo");

    const closeVideo =
      document.querySelector("#closeVideo");


    /*
      MARKER FOUND
    */

    marker.addEventListener("markerFound", () => {

      videoPanel.style.display = "block";

    });


    /*
      MARKER LOST
    */

    marker.addEventListener("markerLost", () => {

      videoPanel.style.display = "none";

    });


    /*
      WATCH VIDEO
    */

    watchVideo.addEventListener("click", () => {

      videoOverlay.style.display = "block";

      youtubeFrame.src =
        "https://www.youtube.com/embed/YOUR_VIDEO_ID?autoplay=1";

    });


    /*
      CLOSE VIDEO
    */

    closeVideo.addEventListener("click", () => {

      videoOverlay.style.display = "none";

      /*
        Clearing the iframe source
        stops the YouTube video.
      */

      youtubeFrame.src = "";

    });

  </script>

</body>
</html>
