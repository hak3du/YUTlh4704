<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Framed embedded player aligned to Layer 3. */
    #youtube-panel { position:fixed; display:none; z-index:9000; overflow:hidden; background:#05070b; border:1px solid rgba(155,220,255,.82); border-radius:9px; box-shadow:0 0 0 1px rgba(30,160,220,.22),0 0 24px rgba(0,170,255,.28),0 12px 38px rgba(0,0,0,.48); box-sizing:border-box; }
    #youtube-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000; }
    #youtube-chrome { position:absolute; z-index:3; top:0; left:0; right:0; height:27px; display:flex; align-items:center; justify-content:space-between; padding:0 7px 0 10px; box-sizing:border-box; color:rgba(225,245,255,.95); background:linear-gradient(90deg,rgba(5,13,23,.94),rgba(9,36,53,.76)); border-bottom:1px solid rgba(140,220,255,.42); font:600 9px/1 Arial,sans-serif; letter-spacing:1.35px; text-transform:uppercase; pointer-events:none; }
    #youtube-close { pointer-events:auto; border:1px solid rgba(210,240,255,.5); border-radius:5px; width:21px; height:21px; padding:0; color:white; background:rgba(0,0,0,.55); font:16px/18px Arial,sans-serif; cursor:pointer; }
    @media (max-width:600px) { #youtube-panel { border-radius:6px; } #youtube-chrome { height:23px; font-size:8px; } #youtube-close { width:19px; height:19px; line-height:16px; } }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>
  <div id="youtube-panel" aria-label="Embedded video player aligned with Layer 3">
    <iframe id="youtube-frame" title="Layer 3 video" src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="youtube-chrome"><span>Layer 03 / Video</span>
      <button id="youtube-close" type="button" aria-label="Close video">×</button>
    </div>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <img
        id="pic3"
        src="https://i.ytimg.com/vi/qGlJVZP9Ie8/hqdefault.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — TRACKED VIDEO PANEL
             YouTube playback is projected over this
             marker-attached plane by the overlay tracker.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="3.6"
          height="2"
          material="
            src: #pic3;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
            side: double;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const videoPanel = document.querySelector("#panel-3");
    const youtubeOverlay = document.querySelector("#youtube-panel");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const youtubeClose = document.querySelector("#youtube-close");
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1";
    let markerVisible = false;
    let youtubeOpen = false;

    function openYoutube() {
      if (!markerVisible || youtubeOpen) return;
      youtubeOpen = true;
      // Load the player directly from the user gesture; muted autoplay is browser-friendlier.
      youtubeFrame.src = YOUTUBE_EMBED;
      youtubeOverlay.style.display = "block";
      status.innerText = "Video opened — use YouTube controls to unmute or pause";
    }

    function closeYoutube() {
      youtubeOpen = false;
      youtubeOverlay.style.display = "none";
      youtubeFrame.src = "about:blank";
      if (markerVisible) status.innerText = "✓ MARKER DETECTED — tap Layer 3 to play";
    }

    youtubeClose.addEventListener("click", function(event) {
      event.stopPropagation();
      closeYoutube();
    });

    marker.addEventListener("markerFound", function() {
      markerVisible = true;
      status.innerText = "✓ MARKER DETECTED — tap Layer 3 to play";
    });
    marker.addEventListener("markerLost", function() {
      markerVisible = false;
      closeYoutube();
      status.innerText = "Marker lost — point camera at marker";
    });

    function projectPanel3() {
      const mesh = videoPanel && videoPanel.getObject3D("mesh");
      if (!mesh || !scene.camera || !scene.canvas) return null;
      const canvasRect = scene.canvas.getBoundingClientRect();
      const corners = [
        new THREE.Vector3(-1.8,-1.0,0), new THREE.Vector3(1.8,-1.0,0),
        new THREE.Vector3(1.8,1.0,0), new THREE.Vector3(-1.8,1.0,0)
      ];
      scene.object3D.updateMatrixWorld(true);
      scene.camera.updateMatrixWorld(true);
      const projected = corners.map(function(corner) {
        mesh.localToWorld(corner);
        corner.project(scene.camera);
        return {
          x: canvasRect.left + (corner.x + 1) * canvasRect.width / 2,
          y: canvasRect.top + (1 - corner.y) * canvasRect.height / 2,
          z: corner.z
        };
      });
      if (projected.some(function(p) { return p.z < -1 || p.z > 1; })) return null;
      const left = Math.max(0,Math.min.apply(null,projected.map(function(p){return p.x;})));
      const top = Math.max(0,Math.min.apply(null,projected.map(function(p){return p.y;})));
      const right = Math.min(window.innerWidth,Math.max.apply(null,projected.map(function(p){return p.x;})));
      const bottom = Math.min(window.innerHeight,Math.max.apply(null,projected.map(function(p){return p.y;})));
      if (right-left < 48 || bottom-top < 30) return null;
      return {left:left,top:top,width:right-left,height:bottom-top};
    }

    function handleCanvasPointer(event) {
      if (!markerVisible || youtubeOpen || !scene.camera || !scene.canvas) return;
      const mesh = videoPanel && videoPanel.getObject3D("mesh");
      if (!mesh) return;
      const rect = scene.canvas.getBoundingClientRect();
      const pointer = new THREE.Vector2(
        ((event.clientX-rect.left)/rect.width)*2-1,
        -((event.clientY-rect.top)/rect.height)*2+1
      );
      const raycaster = new THREE.Raycaster();
      scene.camera.updateMatrixWorld(true);
      raycaster.setFromCamera(pointer,scene.camera);
      if (raycaster.intersectObject(mesh,false).length) {
        event.preventDefault();
        openYoutube();
      }
    }

    AFRAME.registerComponent("youtube-panel-tracker", {
      tick: function() {
        if (!youtubeOpen || !markerVisible || !scene.camera) {
          youtubeOverlay.style.display = "none";
          return;
        }
        try {
          const rect = projectPanel3();
          if (!rect) { youtubeOverlay.style.display = "none"; return; }
          youtubeOverlay.style.left = rect.left + "px";
          youtubeOverlay.style.top = rect.top + "px";
          youtubeOverlay.style.width = rect.width + "px";
          youtubeOverlay.style.height = rect.height + "px";
          youtubeOverlay.style.display = "block";
        } catch (error) {
          console.warn("Layer 3 player positioning paused:",error);
          youtubeOverlay.style.display = "none";
        }
      }
    });

    scene.addEventListener("loaded", function() {
      scene.setAttribute("youtube-panel-tracker","");
      if (scene.canvas) scene.canvas.addEventListener("pointerup",handleCanvasPointer,{passive:false});
      status.innerText = "Camera ready — scan marker";
    });
  </script>


</body>

</html>
