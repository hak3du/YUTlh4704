<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Legacy screen-space YouTube window, registered to tracked panel 3. */
    #youtube-panel {
      position: fixed; display: none; z-index: 9000; overflow: hidden;
      pointer-events: auto; background: #02070b;
      border: 1px solid rgba(65,235,255,.72);
      box-shadow: 0 0 18px rgba(0,225,255,.22);
      transform-origin: top left; will-change: left,top,width,height,clip-path;
    }
    #youtube-frame { display:block; width:100%; height:100%; border:0; background:#02070b; }
    #immersive-controls { position:fixed; right:16px; bottom:18px; z-index:11000; display:flex; gap:8px; }
    #immersive-controls button { border:1px solid rgba(220,190,120,.8); border-radius:999px; padding:12px 16px; color:#f7e8c5; background:rgba(8,8,10,.88); font:600 12px Arial,sans-serif; letter-spacing:.08em; }
    #immersive-controls button:active { transform:scale(.98); }
    #exit-360 { display:none; }
    #status { max-width:calc(100vw - 40px); }
  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>

  <div id="immersive-controls" aria-label="Immersive wedding video controls">
    <button id="enter-360" type="button">ENTER 360° MEMORY</button>
    <button id="exit-360" type="button">EXIT 360°</button>
    <button id="youtube-360" type="button">YOUTUBE 360° DEMO</button>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <!-- Add an equirectangular 360-degree wedding MP4 at this path.
           YouTube streams cannot be used as WebGL video textures. -->
      <video
        id="wedding-360-video"
        src="./assets/wedding-360.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
        loop
        crossorigin="anonymous"
      ></video>

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="5.85"

          height="3.25"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.90"

          width="3.6"

          height="2"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.60"

          width="2.25"

          height="1.25"

          material="
            shader: flat;
            transparent: true;
            opacity: 0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.30"

          width="4.2"

          height="2.33"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="2.7"

          height="1.5"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera>
      <a-entity
        cursor="fuse: false; rayOrigin: entity"
        raycaster="objects: #panel-3; far: 10"
        position="0 0 -1">
      </a-entity>
    </a-entity>


  </a-scene>


  <!-- YouTube iframe overlay follows panel 3 in screen space (legacy layout). -->
  <div id="youtube-panel" aria-label="Intro video panel">
    <iframe id="youtube-frame" title="Portfolio introduction video"
      src="https://www.youtube-nocookie.com/embed/hSNLuPRiWWA?autoplay=0&mute=1&playsinline=1&controls=1&rel=0&enablejsapi=1&origin=https%3A%2F%2Fhak3du.github.io"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const panel = document.querySelector("#panel-3");
    const overlay = document.querySelector("#youtube-panel");
    const frame = document.querySelector("#youtube-frame");
    let markerVisible = false;
    let immersive360Active = false;
    let sphereMesh = null;
    const wedding360Video = document.querySelector("#wedding-360-video");
    const cameraEntity = document.querySelector("#ar-camera");
    const enter360Button = document.querySelector("#enter-360");
    const exit360Button = document.querySelector("#exit-360");
    const youtube360Button = document.querySelector("#youtube-360");

    function create360VideoSphere() {
      if (sphereMesh || !cameraEntity?.object3D) return;
      const texture = new THREE.VideoTexture(wedding360Video);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      const geometry = new THREE.SphereGeometry(40, 64, 48);
      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
      sphereMesh = new THREE.Mesh(geometry, material);
      sphereMesh.visible = false;
      sphereMesh.frustumCulled = false;
      cameraEntity.object3D.add(sphereMesh);
    }

    async function enter360Memory() {
      create360VideoSphere();
      if (!sphereMesh) {
        status.innerText = "360 viewer is still initializing.";
        return;
      }
      try {
        await wedding360Video.play();
        immersive360Active = true;
        sphereMesh.visible = true;
        enter360Button.style.display = "none";
        exit360Button.style.display = "inline-block";
        overlay.style.display = "none";
        status.innerText = "360° MEMORY ACTIVE — move your camera to look around";
      } catch (error) {
        status.innerText = "Add ./assets/wedding-360.mp4 to enable the Three.js 360° viewer.";
        console.warn("360 video playback could not start:", error);
      }
    }

    function exit360Memory() {
      immersive360Active = false;
      if (sphereMesh) sphereMesh.visible = false;
      wedding360Video.pause();
      enter360Button.style.display = "inline-block";
      exit360Button.style.display = "none";
      status.innerText = markerVisible ? "AR marker detected." : "Point camera at the AR marker.";
    }

    enter360Button.addEventListener("click", enter360Memory);
    exit360Button.addEventListener("click", exit360Memory);
    youtube360Button.addEventListener("click", () => {
      window.open("https://www.youtube.com/watch?v=hSNLuPRiWWA", "_blank", "noopener,noreferrer");
    });

    function postYouTubeCommand(func) {
      frame.contentWindow?.postMessage(JSON.stringify({event:"command",func,args:[]}), "https://www.youtube-nocookie.com");
    }

    function projectPanel() {
      if (!markerVisible || !scene.camera || !scene.renderer) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }
      const rect = scene.renderer.domElement.getBoundingClientRect();
      const camera = scene.camera;
      const w0 = Number(panel.getAttribute("width")) || 2.25;
      const h0 = Number(panel.getAttribute("height")) || 1.25;
      if (!panel.getObject3D("mesh")?.geometry) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }
      panel.object3D.updateWorldMatrix(true, false);
      camera.updateMatrixWorld(true);
      const corners = [[-w0/2,-h0/2,0],[w0/2,-h0/2,0],[w0/2,h0/2,0],[-w0/2,h0/2,0]];
      const points = corners.map(([x,y,z]) => {
        const p = new THREE.Vector3(x,y,z);
        panel.object3D.localToWorld(p);
        p.project(camera);
        return {x:rect.left+(p.x+1)*rect.width/2,y:rect.top+(1-p.y)*rect.height/2,z:p.z};
      });
      if (points.some(p => !Number.isFinite(p.x)||!Number.isFinite(p.y)||!Number.isFinite(p.z)||p.z < -1||p.z > 1)) {
        overlay.style.display="none"; requestAnimationFrame(projectPanel); return;
      }
      const minX=Math.min(...points.map(p=>p.x)), maxX=Math.max(...points.map(p=>p.x));
      const minY=Math.min(...points.map(p=>p.y)), maxY=Math.max(...points.map(p=>p.y));
      const width=maxX-minX, height=maxY-minY;
      if (![minX,maxX,minY,maxY,width,height].every(Number.isFinite)||width<2||height<2) {
        overlay.style.display="none"; requestAnimationFrame(projectPanel); return;
      }
      overlay.style.display="block";
      overlay.style.left=minX+"px"; overlay.style.top=minY+"px";
      overlay.style.width=width+"px"; overlay.style.height=height+"px";
      overlay.style.clipPath="polygon("+points.map(p=>((p.x-minX)/width*100).toFixed(2)+"% "+((p.y-minY)/height*100).toFixed(2)+"%").join(",")+")";
      requestAnimationFrame(projectPanel);
    }
    marker.addEventListener("markerFound", () => {
      markerVisible=true; status.innerText="✓ MARKER DETECTED — video panel active";
      postYouTubeCommand("playVideo");
    });
    marker.addEventListener("markerLost", () => {
      markerVisible=false; overlay.style.display="none";
      status.innerText="Marker lost — point camera at marker";
      postYouTubeCommand("pauseVideo");
    });
    scene.addEventListener("loaded", () => {
      status.innerText="Camera ready — scan marker";
      create360VideoSphere();
      requestAnimationFrame(projectPanel);
    });
  </script>


</body>

</html>
