<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Video</title>


  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- AR.js -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /*
      DEBUG STATUS
    */

    #status {

      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <!-- ===================================
       DEBUG
       =================================== -->

  <div id="status">

    Looking for marker...

  </div>


  <!-- ===================================
       AR SCENE
       =================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =================================
         MARKER
         ================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =================================
           REAL AR PORTFOLIO SURFACE

           THIS IS ANCHORED TO THE MARKER.
           ================================= -->

      <a-plane

        position="0 0.5 0"

        rotation="-90 0 0"

        width="1.8"

        height="1"

        color="#111"

        opacity="0.9"

      >

      </a-plane>


      <!-- =================================
           AR TITLE
           ================================= -->

      <a-text

        value="PORTFOLIO"

        position="0 0.55 0"

        rotation="-90 0 0"

        align="center"

        width="3"

        color="white"

      >

      </a-text>


    </a-marker>


    <!-- =================================
         CAMERA
         ================================= -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>


    /*
      ======================================
      ELEMENTS
      ======================================
    */

    const marker =
      document.querySelector("#marker");


    const status =
      document.querySelector("#status");


    /*
      ======================================
      MARKER FOUND
      ======================================
    */

    marker.addEventListener(

      "markerFound",

      function () {

        console.log(
          "MARKER FOUND"
        );


        status.innerText =
          "✓ MARKER DETECTED";

      }

    );


    /*
      ======================================
      MARKER LOST
      ======================================
    */

    marker.addEventListener(

      "markerLost",

      function () {

        console.log(
          "MARKER LOST"
        );


        status.innerText =
          "Marker lost — point camera at marker";

      }

    );


    /*
      ======================================
      AR READY
      ======================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(

        "loaded",

        function () {

          console.log(
            "A-FRAME LOADED"
          );


          status.innerText =
            "Camera ready — scan marker";

        }

      );

  </script>


</body>

</html>
