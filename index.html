<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Independent phone control and centered YouTube player. */
    #video-launch { position:fixed; z-index:8000; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:10px; border:1px solid rgba(145,225,255,.68); border-radius:999px; padding:13px 21px; color:#eafaff; background:linear-gradient(135deg,rgba(8,28,44,.96),rgba(5,13,25,.96)); box-shadow:0 0 0 1px rgba(80,190,255,.12),0 8px 30px rgba(0,0,0,.38),0 0 22px rgba(0,170,255,.18); font:700 11px/1 Arial,sans-serif; letter-spacing:1.8px; text-transform:uppercase; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    #video-launch .play-mark { display:inline-grid; place-items:center; width:23px; height:23px; border:1px solid rgba(145,225,255,.72); border-radius:50%; color:#9beaff; font-size:10px; letter-spacing:0; }
    #youtube-backdrop { position:fixed; inset:0; z-index:8998; display:none; background:rgba(1,7,14,.84); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); }
    #youtube-panel { position:fixed; z-index:8999; display:none; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92vw,900px); aspect-ratio:16/9; overflow:hidden; background:#05070b; border:1px solid rgba(155,220,255,.82); border-radius:10px; box-shadow:0 0 0 1px rgba(30,160,220,.22),0 0 30px rgba(0,170,255,.24),0 18px 55px rgba(0,0,0,.58); box-sizing:border-box; }
    #youtube-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000; }
    #youtube-chrome { position:absolute; z-index:3; top:0; left:0; right:0; height:30px; display:flex; align-items:center; justify-content:space-between; padding:0 9px 0 12px; box-sizing:border-box; color:rgba(225,245,255,.95); background:linear-gradient(90deg,rgba(5,13,23,.94),rgba(9,36,53,.76)); border-bottom:1px solid rgba(140,220,255,.42); font:600 9px/1 Arial,sans-serif; letter-spacing:1.35px; text-transform:uppercase; pointer-events:none; }
    #youtube-close { pointer-events:auto; border:1px solid rgba(210,240,255,.5); border-radius:5px; width:22px; height:22px; padding:0; color:white; background:rgba(0,0,0,.55); font:16px/18px Arial,sans-serif; cursor:pointer; }
    @media (max-width:600px) { #video-launch { bottom:max(18px,env(safe-area-inset-bottom)); padding:12px 18px; font-size:10px; } #youtube-panel { width:94vw; border-radius:6px; } #youtube-chrome { height:25px; font-size:8px; } #youtube-close { width:19px; height:19px; line-height:16px; } }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>
  <button id="video-launch" type="button" aria-label="Play portfolio video"><span class="play-mark">▶</span><span>Watch film</span></button>
  <div id="youtube-backdrop"></div>
  <div id="youtube-panel" role="dialog" aria-modal="true" aria-label="Portfolio video player">
    <iframe id="youtube-frame" title="Layer 3 video" src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div id="youtube-chrome"><span>Layer 03 / Video</span>
      <button id="youtube-close" type="button" aria-label="Close video">×</button>
    </div>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <img
        id="pic3"
        src="https://i.ytimg.com/vi/qGlJVZP9Ie8/hqdefault.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — TRACKED VIDEO PANEL
             YouTube playback is projected over this
             marker-attached plane by the overlay tracker.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="3.6"
          height="2"
          material="
            src: #pic3;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
            side: double;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const youtubeOverlay = document.querySelector("#youtube-panel");
    const youtubeBackdrop = document.querySelector("#youtube-backdrop");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const youtubeClose = document.querySelector("#youtube-close");
    const videoLaunch = document.querySelector("#video-launch");
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1";
    let markerVisible = false;
    let youtubeOpen = false;

    function openYoutube() {
      if (youtubeOpen) return;
      youtubeOpen = true;
      youtubeFrame.src = YOUTUBE_EMBED;
      youtubeBackdrop.style.display = "block";
      youtubeOverlay.style.display = "block";
      status.innerText = markerVisible
        ? "Video playing independently — AR artwork remains unchanged"
        : "Video playing — point camera at marker to view the AR artwork";
    }

    function closeYoutube() {
      youtubeOpen = false;
      youtubeOverlay.style.display = "none";
      youtubeBackdrop.style.display = "none";
      youtubeFrame.src = "about:blank";
      if (markerVisible) status.innerText = "✓ MARKER DETECTED";
    }

    videoLaunch.addEventListener("click", openYoutube);
    youtubeClose.addEventListener("click", closeYoutube);
    youtubeBackdrop.addEventListener("click", closeYoutube);
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && youtubeOpen) closeYoutube();
    });

    marker.addEventListener("markerFound", function() {
      markerVisible = true;
      if (!youtubeOpen) status.innerText = "✓ MARKER DETECTED";
    });
    marker.addEventListener("markerLost", function() {
      markerVisible = false;
      if (!youtubeOpen) status.innerText = "Marker lost — point camera at marker";
    });

    scene.addEventListener("loaded", function() {
      status.innerText = "Camera ready — scan marker";
    });
  </script>


</body>

</html>
