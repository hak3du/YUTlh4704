```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Video</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;
    }

  </style>
</head>


<body>


  <!-- DEBUG -->

  <div id="status">
    Looking for marker...
  </div>


  <!-- ===================================
       AR SCENE
       =================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =================================
         VIDEO ASSET
         ================================= -->

    <a-assets>

      <video

        id="portfolioVideo"

        src="portfolio.mp4"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>

    </a-assets>


    <!-- =================================
         MARKER
         ================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =================================
           VIDEO REPLACES THE OLD PLANE
           ================================= -->

      <a-video

        id="videoPlane"

        src="#portfolioVideo"

        position="0 0.5 0"

        rotation="-90 0 0"

        width="1.8"

        height="1.0125"

      ></a-video>


    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>


    const marker =
      document.querySelector("#marker");

    const video =
      document.querySelector("#portfolioVideo");

    const status =
      document.querySelector("#status");


    /*
      ======================================
      MARKER FOUND
      ======================================
    */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";


        /*
          Start the video.
        */

        video.play().catch(
          function(error) {

            console.log(
              "Video autoplay blocked:",
              error
            );

          }
        );

      }
    );


    /*
      ======================================
      MARKER LOST
      ======================================
    */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }
    );


    /*
      ======================================
      AR READY
      ======================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(
        "loaded",
        function () {

          console.log("A-FRAME LOADED");

          status.innerText =
            "Camera ready — scan marker";

        }
      );

  </script>

</body>
</html>
```
