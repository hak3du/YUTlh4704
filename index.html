<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    #youtube-panel {
      position: fixed;
      display: none;
      z-index: 9000;
      overflow: hidden;
      pointer-events: auto;
      background: #000;
    }

    #youtube-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >

      <!-- YouTube playback is rendered in a tracked DOM layer over panel-3. -->

      <img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="5.85"

          height="3.25"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.90"

          width="3.6"

          height="2"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.60"

          width="2.25"

          height="1.25"

          material="
            shader: flat;
            transparent: true;
            opacity: 0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.30"

          width="4.2"

          height="2.33"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="2.7"

          height="1.5"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity camera>
      <a-entity
        cursor="fuse: false; rayOrigin: entity"
        raycaster="objects: #panel-3; far: 10"
        position="0 0 -1">
      </a-entity>
    </a-entity>


  </a-scene>



  <!-- YouTube video aligned to the existing middle AR panel, not a popup. -->
  <div id="youtube-panel" aria-label="Intro video panel">
    <iframe
      id="youtube-frame"
      title="Portfolio introduction video"
      src="https://www.youtube-nocookie.com/embed/aGIFkEbYzFE?autoplay=0&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1&enablejsapi=1&origin=https%3A%2F%2Fhak3du.github.io"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const panel = document.querySelector("#panel-3");
    const overlay = document.querySelector("#youtube-panel");
    const frame = document.querySelector("#youtube-frame");
    let markerVisible = false;

    function postYouTubeCommand(func) {
      frame.contentWindow?.postMessage(JSON.stringify({
        event: "command",
        func,
        args: []
      }), "https://www.youtube-nocookie.com");
    }

    function projectPanel() {
      if (!markerVisible || !panel || !scene.camera || !scene.renderer) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }

      const camera = scene.camera;
      const renderer = scene.renderer;
      const canvas = renderer.domElement;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const geometry = panel.getObject3D("mesh")?.geometry;
      if (!geometry) {
        requestAnimationFrame(projectPanel);
        return;
      }

      const positions = [
        [-1.125, -0.625, 0],
        [1.125, -0.625, 0],
        [1.125, 0.625, 0],
        [-1.125, 0.625, 0]
      ];

      panel.object3D.updateWorldMatrix(true, false);
      camera.updateMatrixWorld(true);
      const points = positions.map(([x, y, z]) => {
        const v = new THREE.Vector3(x, y, z);
        panel.object3D.localToWorld(v);
        v.project(camera);
        return {
          x: rect.left + (v.x + 1) * width / 2,
          y: rect.top + (1 - v.y) * height / 2
        };
      });

      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));
      const w = maxX - minX;
      const h = maxY - minY;

      if (![minX, maxX, minY, maxY, w, h].every(Number.isFinite) || w < 2 || h < 2) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }

      overlay.style.display = "block";
      overlay.style.left = minX + "px";
      overlay.style.top = minY + "px";
      overlay.style.width = w + "px";
      overlay.style.height = h + "px";
      const clip = points.map(p => ((p.x - minX) / w * 100).toFixed(2) + "% " + ((p.y - minY) / h * 100).toFixed(2) + "%").join(", ");
      overlay.style.clipPath = "polygon(" + clip + ")";
      requestAnimationFrame(projectPanel);
    }

    marker.addEventListener("markerFound", function () {
      markerVisible = true;
      status.innerText = "✓ MARKER DETECTED — intro video panel active";
      postYouTubeCommand("playVideo");
    });

    marker.addEventListener("markerLost", function () {
      markerVisible = false;
      overlay.style.display = "none";
      status.innerText = "Marker lost — point camera at marker";
      postYouTubeCommand("pauseVideo");
    });

    scene.addEventListener("loaded", function () {
      status.innerText = "Camera ready — scan marker";
      requestAnimationFrame(projectPanel);
    });
  </script>


</body>

</html>
