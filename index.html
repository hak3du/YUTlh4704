<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Video</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    #status {

      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }


    /*
      =====================================================
      YOUTUBE AR SURFACE

      This is positioned over the same AR location as
      your original <a-video>.

      The iframe itself is NOT fullscreen.
      =====================================================
    */

    #youtube-container {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 320px;
      height: 180px;

      transform:
        translate(-50%, -50%);

      display: none;

      z-index: 5000;

      pointer-events: auto;

      overflow: hidden;

    }


    #youtube-frame {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

    }

  </style>

</head>


<body>


  <!-- DEBUG -->

  <div id="status">

    Looking for marker...

  </div>


  <!-- =====================================================
       YOUTUBE PLAYER

       Replace VIDEO_ID with your actual YouTube video ID.

       Example:

       https://www.youtube.com/watch?v=ABC123

       becomes:

       ABC123
       ===================================================== -->

  <div id="youtube-container">

    <iframe

      id="youtube-frame"

      src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&playsinline=1&rel=0"

      allow="
        autoplay;
        encrypted-media;
        picture-in-picture
      "

      allowfullscreen

    ></iframe>

  </div>


  <!-- =====================================================
       AR SCENE
       ===================================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =================================================
         MARKER
         ================================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- ===============================================
           SAME ANCHOR POSITION AS ORIGINAL VIDEO
           =============================================== -->

      <a-entity

        id="videoAnchor"

        position="0 0.5 0"

        rotation="-90 0 0"

        scale="1 1 1"

      >

        <!--
          Invisible AR plane.

          This preserves the exact A-Frame geometry:

          position = 0 0.5 0
          width    = 1.8
          height   = 1.0125
        -->

        <a-plane

          id="videoSurface"

          width="1.8"

          height="1.0125"

          material="
            transparent: true;
            opacity: 0;
          "

        ></a-plane>

      </a-entity>


    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>


    const marker =
      document.querySelector("#marker");


    const anchor =
      document.querySelector("#videoAnchor");


    const youtube =
      document.querySelector("#youtube-container");


    const status =
      document.querySelector("#status");


    /*
      =====================================================
      MARKER FOUND
      =====================================================
    */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log(
          "MARKER FOUND"
        );


        status.innerText =
          "✓ MARKER DETECTED";


        /*
          Show YouTube player.
        */

        youtube.style.display =
          "block";


        /*
          Begin synchronization loop.
        */

        syncYoutubeToAR();

      }
    );


    /*
      =====================================================
      MARKER LOST
      =====================================================
    */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log(
          "MARKER LOST"
        );


        status.innerText =
          "Marker lost — point camera at marker";


        youtube.style.display =
          "none";

      }
    );


    /*
      =====================================================
      AR READY
      =====================================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(
        "loaded",
        function () {

          console.log(
            "A-FRAME LOADED"
          );


          status.innerText =
            "Camera ready — scan marker";

        }
      );


    /*
      =====================================================
      SYNCHRONIZE YOUTUBE WITH AR SURFACE
      =====================================================

      The invisible A-Frame plane remains the authoritative
      AR anchor.

      We project its 3D corners into the camera viewport
      and use those coordinates to position the YouTube
      iframe.

      Therefore the iframe follows the marker rather than
      being permanently fixed to the screen.
      =====================================================
    */

    function syncYoutubeToAR() {


      if (
        !marker.object3D.visible
      ) {

        requestAnimationFrame(
          syncYoutubeToAR
        );

        return;

      }


      const scene =
        document.querySelector("a-scene");


      const camera =
        scene.camera;


      const object =
        anchor.object3D;


      /*
        Get world position.
      */

      const position =
        new THREE.Vector3();


      object.getWorldPosition(
        position
      );


      /*
        Project AR position into
        camera coordinates.
      */

      const projected =
        position.clone();


      projected.project(
        camera
      );


      /*
        Convert normalized device
        coordinates to screen pixels.
      */

      const width =
        window.innerWidth;


      const height =
        window.innerHeight;


      const x =
        (projected.x + 1) *
        0.5 *
        width;


      const y =
        (-projected.y + 1) *
        0.5 *
        height;


      /*
        Estimate scale from distance.
      */

      const distance =
        camera.position.distanceTo(
          position
        );


      const baseWidth =
        320;


      const baseDistance =
        1.5;


      let renderedWidth =
        baseWidth *
        (baseDistance / distance);


      /*
        Prevent the player from becoming
        absurdly large or tiny.
      */

      renderedWidth =
        Math.max(
          80,
          Math.min(
            900,
            renderedWidth
          )
        );


      const renderedHeight =
        renderedWidth *
        0.5625;


      youtube.style.width =
        renderedWidth + "px";


      youtube.style.height =
        renderedHeight + "px";


      youtube.style.left =
        x + "px";


      youtube.style.top =
        y + "px";


      youtube.style.transform =
        "translate(-50%, -50%)";


      requestAnimationFrame(
        syncYoutubeToAR
      );

    }

  </script>


</body>
</html>
