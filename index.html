<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Reactive cyber control + marker-projected video surface. */
    #video-launch { position:fixed; z-index:8000; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:13px; min-width:184px; justify-content:center; padding:11px 17px; overflow:hidden; border:1px solid rgba(91,224,255,.88); border-radius:8px; color:#e9fbff; background:linear-gradient(112deg,rgba(3,16,30,.98),rgba(4,40,61,.96) 52%,rgba(3,13,27,.98)); box-shadow:0 0 0 1px rgba(0,190,255,.16),0 0 16px rgba(0,190,255,.22),0 10px 32px rgba(0,0,0,.48),inset 0 0 18px rgba(0,174,255,.10); font:800 11px/1 Arial,sans-serif; letter-spacing:2.2px; text-transform:uppercase; cursor:pointer; isolation:isolate; -webkit-tap-highlight-color:transparent; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease; animation:cyber-pulse 2.8s ease-in-out infinite; }
    #video-launch::before { content:""; position:absolute; z-index:-1; inset:0; background:linear-gradient(105deg,transparent 18%,rgba(110,235,255,.18) 48%,transparent 72%); transform:translateX(-120%); animation:cyber-scan 3.6s ease-in-out infinite; }
    #video-launch::after { content:""; position:absolute; inset:4px; border:1px solid rgba(102,218,255,.16); border-radius:5px; pointer-events:none; }
    #video-launch:hover { transform:translateX(-50%) translateY(-3px) scale(1.035); border-color:#c3f7ff; filter:brightness(1.18); box-shadow:0 0 0 1px rgba(0,210,255,.28),0 0 28px rgba(0,190,255,.42),0 14px 36px rgba(0,0,0,.5),inset 0 0 22px rgba(0,174,255,.16); }
    #video-launch:active { transform:translateX(-50%) scale(.97); filter:brightness(1.35); }
    #video-launch:focus-visible { outline:2px solid #b7f5ff; outline-offset:5px; }
    #video-launch .play-mark { display:inline-grid; place-items:center; width:23px; height:23px; border:1px solid rgba(130,235,255,.9); border-radius:50%; color:#9beaff; font-size:11px; letter-spacing:0; text-shadow:0 0 10px #35cfff; box-shadow:0 0 12px rgba(0,190,255,.26),inset 0 0 8px rgba(0,190,255,.14); }
    #video-launch .button-copy { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
    #video-launch .button-copy strong { font:800 11px/1 Arial,sans-serif; letter-spacing:2px; }
    #video-launch .button-copy small { color:#72cce5; font:600 7px/1 Arial,sans-serif; letter-spacing:1.7px; }
    #video-overlay { position:fixed; z-index:9000; display:none; overflow:hidden; background:#000; border:1px solid rgba(155,220,255,.9); box-shadow:0 0 0 1px rgba(0,190,255,.18),0 0 26px rgba(0,170,255,.34),0 0 70px rgba(0,80,150,.2); box-sizing:border-box; }
    #youtube-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000; }
    #youtube-close { position:absolute; z-index:2; top:7px; right:7px; width:31px; height:31px; padding:0; border:1px solid rgba(210,240,255,.78); border-radius:6px; color:white; background:rgba(0,8,18,.82); font:20px/27px Arial,sans-serif; cursor:pointer; box-shadow:0 0 12px rgba(0,190,255,.3); }
    #youtube-close:hover { background:rgba(0,95,130,.94); box-shadow:0 0 18px rgba(0,190,255,.55); }
    @keyframes cyber-pulse { 0%,100% { box-shadow:0 0 0 1px rgba(0,190,255,.16),0 0 14px rgba(0,190,255,.18),0 10px 32px rgba(0,0,0,.48),inset 0 0 16px rgba(0,174,255,.08); } 50% { box-shadow:0 0 0 1px rgba(0,220,255,.3),0 0 25px rgba(0,190,255,.38),0 10px 32px rgba(0,0,0,.48),inset 0 0 22px rgba(0,174,255,.15); } }
    @keyframes cyber-scan { 0%,18% { transform:translateX(-120%); } 62%,100% { transform:translateX(120%); } }
    @media (prefers-reduced-motion:reduce) { #video-launch,#video-launch::before { animation:none; transition:none; } }
    @media (max-width:600px) { #video-launch { bottom:max(20px,env(safe-area-inset-bottom)); min-width:174px; padding:10px 15px; } #youtube-close { width:28px; height:28px; line-height:24px; } }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>
  <button id="video-launch" type="button" aria-label="Play Layer 03 video"><span class="play-mark">▶</span><span class="button-copy"><strong>INITIATE VIDEO</strong><small>SECURE MEDIA LINK // 03</small></span></button>
  <div id="video-overlay" aria-label="Layer 3 video">
    <iframe id="youtube-frame" title="Layer 3 video" src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <button id="youtube-close" type="button" aria-label="Stop video and restore layers">×</button>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="./p1.png"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="./p2.png"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <img
        id="pic3"
        src="./digitalme.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — PEXELS IMAGE / VIDEO PLANE
             Static image remains visible until playback starts.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="1.36"
          height="0.765"
          material="
            src: #pic3;
            shader: flat;
            transparent: true;
            opacity: 0.98;
            depthWrite: false;
            side: double;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const videoOverlay = document.querySelector("#video-overlay");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const youtubeClose = document.querySelector("#youtube-close");
    const videoLaunch = document.querySelector("#video-launch");
    const panel3 = document.querySelector("#panel-3");
    const stackPanels = ["#panel-1", "#panel-2", "#panel-4", "#panel-5"]
      .map(selector => document.querySelector(selector));
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=0&playsinline=1&controls=1&rel=0&modestbranding=1";
    let markerVisible = false;
    let youtubeOpen = false;
    let animationFrame = 0;

    function setArtworkVisible(visible) {
      stackPanels.forEach(panel => panel.setAttribute("visible", visible));
      panel3.setAttribute("visible", !youtubeOpen);
    }

    function projectVideoPanel() {
      if (!youtubeOpen || !markerVisible || !scene.camera || !panel3.object3D) {
        videoOverlay.style.display = "none";
        return;
      }

      panel3.object3D.updateWorldMatrix(true, false);
      scene.camera.updateMatrixWorld(true);
      const halfW = 0.68;
      const halfH = 0.3825;
      const corners = [
        new THREE.Vector3(-halfW, -halfH, 0),
        new THREE.Vector3( halfW, -halfH, 0),
        new THREE.Vector3( halfW,  halfH, 0),
        new THREE.Vector3(-halfW,  halfH, 0)
      ];

      const projected = corners.map(point => {
        point.applyMatrix4(panel3.object3D.matrixWorld);
        point.project(scene.camera);
        return {
          x: (point.x * 0.5 + 0.5) * window.innerWidth,
          y: (-point.y * 0.5 + 0.5) * window.innerHeight,
          z: point.z
        };
      });

      if (projected.some(point => point.z < -1 || point.z > 1)) {
        videoOverlay.style.display = "none";
        return;
      }

      const xs = projected.map(point => point.x);
      const ys = projected.map(point => point.y);
      const left = Math.max(0, Math.min(...xs));
      const top = Math.max(0, Math.min(...ys));
      const right = Math.min(window.innerWidth, Math.max(...xs));
      const bottom = Math.min(window.innerHeight, Math.max(...ys));
      const projectedWidth = right - left;
      const projectedHeight = bottom - top;

      if (projectedWidth < 24 || projectedHeight < 24) {
        videoOverlay.style.display = "none";
        return;
      }

      // Keep the YouTube viewport in a true landscape 16:9 rectangle.
      const frameWidth = Math.min(projectedWidth, projectedHeight * (16 / 9));
      const frameHeight = frameWidth * (9 / 16);
      const centerX = (left + right) / 2;
      const centerY = (top + bottom) / 2;

      videoOverlay.style.left = (centerX - frameWidth / 2) + "px";
      videoOverlay.style.top = (centerY - frameHeight / 2) + "px";
      videoOverlay.style.width = frameWidth + "px";
      videoOverlay.style.height = frameHeight + "px";
      videoOverlay.style.display = "block";
    }

    function trackVideo() {
      if (!youtubeOpen) return;
      projectVideoPanel();
      animationFrame = requestAnimationFrame(trackVideo);
    }

    function openYoutube() {
      if (youtubeOpen) return;
      if (!markerVisible) {
        status.innerText = "Scan the marker first, then play Layer 03";
        return;
      }
      youtubeOpen = true;
      setArtworkVisible(false);
      youtubeFrame.src = YOUTUBE_EMBED;
      videoLaunch.style.display = "none";
      trackVideo();
      status.innerText = "✓ LAYER 03 VIDEO ACTIVE";
    }

    function closeYoutube() {
      if (!youtubeOpen) return;
      youtubeOpen = false;
      cancelAnimationFrame(animationFrame);
      youtubeFrame.src = "about:blank";
      videoOverlay.style.display = "none";
      setArtworkVisible(true);
      videoLaunch.style.display = "flex";
      status.innerText = markerVisible
        ? "✓ MARKER DETECTED"
        : "Marker lost — point camera at marker";
    }

    videoLaunch.addEventListener("click", openYoutube);
    youtubeClose.addEventListener("click", closeYoutube);

    marker.addEventListener("markerFound", function() {
      markerVisible = true;
      if (!youtubeOpen) status.innerText = "✓ MARKER DETECTED";
    });

    marker.addEventListener("markerLost", function() {
      markerVisible = false;
      if (youtubeOpen) closeYoutube();
      status.innerText = "Marker lost — point camera at marker";
    });

    scene.addEventListener("loaded", function() {
      status.innerText = "Camera ready — scan marker";
    });

    window.addEventListener("resize", function() {
      if (youtubeOpen) projectVideoPanel();
    });
  </script>


</body>

</html>
