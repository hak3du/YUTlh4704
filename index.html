<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* YouTube playback surface, positioned over Layer 3's projected screen area. */
    #youtube-panel {
      position: fixed;
      display: none;
      z-index: 9000;
      overflow: hidden;
      background: #000;
      /* SVG luminance mask cuts foreground cards out of the iframe surface. */
      -webkit-mask: url(#youtube-occlusion-mask);
      mask: url(#youtube-occlusion-mask);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
    #youtube-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #youtube-close {
      position: absolute;
      z-index: 2;
      top: 4px;
      right: 4px;
      border: 0;
      border-radius: 3px;
      padding: 4px 7px;
      color: white;
      background: rgba(0,0,0,.75);
      cursor: pointer;
    }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>
  <svg id="youtube-mask-defs" aria-hidden="true" width="0" height="0"
       style="position:absolute; width:0; height:0; overflow:hidden">
    <defs>
      <mask id="youtube-occlusion-mask"
            maskUnits="userSpaceOnUse"
            maskContentUnits="userSpaceOnUse"
            x="0" y="0" width="1" height="1">
        <rect id="youtube-mask-base" x="0" y="0" width="1" height="1" fill="black"></rect>
        <polygon id="youtube-mask-layer3" points="" fill="white"></polygon>
        <polygon id="youtube-mask-layer4" points="" fill="black"></polygon>
        <polygon id="youtube-mask-layer5" points="" fill="black"></polygon>
      </mask>
    </defs>
  </svg>
  <div id="youtube-panel" aria-label="YouTube video playing on Layer 3">
    <button id="youtube-close" type="button" aria-label="Close video">×</button>
    <iframe
      id="youtube-frame"
      title="Layer 3 video"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>



  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <img
        id="pic3"
        src="https://i.ytimg.com/vi/qGlJVZP9Ie8/hqdefault.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — TRACKED VIDEO PANEL
             YouTube playback is projected over this
             marker-attached plane by the overlay tracker.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="3.6"
          height="2"
          material="
            src: #pic3;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
            side: double;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera>
      <a-entity
        cursor="rayOrigin: mouse"
        raycaster="objects: #panel-3"
      ></a-entity>
    </a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const videoPanel = document.querySelector("#panel-3");
    const youtubeOverlay = document.querySelector("#youtube-panel");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const youtubeClose = document.querySelector("#youtube-close");
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0";

    let markerVisible = false;
    let youtubeOpen = false;

    function closeYoutube() {
      youtubeOpen = false;
      youtubeOverlay.style.display = "none";
      youtubeFrame.src = "about:blank";
    }

    youtubeClose.addEventListener("click", (event) => {
      event.stopPropagation();
      closeYoutube();
    });

    // A tap on the native Layer 3 plane opens the embedded player in place.
    videoPanel.addEventListener("click", () => {
      if (!markerVisible) return;
      youtubeOpen = true;
      youtubeFrame.src = YOUTUBE_EMBED;
      youtubeOverlay.style.display = "block";
    });

    marker.addEventListener("markerFound", () => {
      markerVisible = true;
      status.innerText = "✓ MARKER DETECTED — portfolio stack active";
    });

    marker.addEventListener("markerLost", () => {
      markerVisible = false;
      closeYoutube();
      status.innerText = "Marker lost — point camera at marker";
    });

    // Project any panel's four corners into viewport coordinates.
    function projectPanel(panelId, width, height) {
      const panel = document.getElementById(panelId);
      const mesh = panel && panel.getObject3D("mesh");
      if (!mesh || !scene.camera) return null;

      const halfW = width / 2;
      const halfH = height / 2;
      const corners = [
        new THREE.Vector3(-halfW, -halfH, 0),
        new THREE.Vector3( halfW, -halfH, 0),
        new THREE.Vector3( halfW,  halfH, 0),
        new THREE.Vector3(-halfW,  halfH, 0)
      ];

      return corners.map((corner) => {
        mesh.localToWorld(corner);
        corner.project(scene.camera);
        return {
          x: canvasRect.left + (corner.x + 1) * canvasRect.width / 2,
          y: canvasRect.top + (1 - corner.y) * canvasRect.height / 2,
          z: corner.z
        };
      });
    }

    function polygonPoints(points, left, top) {
      return points.map(p => (p.x - left).toFixed(1) + "," + (p.y - top).toFixed(1)).join(" ");
    }

    function setMask(panel3Points, panel4Points, panel5Points, width, height, left, top) {
      const mask = document.getElementById("youtube-occlusion-mask");
      mask.setAttribute("x", "0");
      mask.setAttribute("y", "0");
      mask.setAttribute("width", String(width));
      mask.setAttribute("height", String(height));

      const base = document.getElementById("youtube-mask-base");
      base.setAttribute("width", String(width));
      base.setAttribute("height", String(height));

      document.getElementById("youtube-mask-layer3")
        .setAttribute("points", polygonPoints(panel3Points, left, top));
      document.getElementById("youtube-mask-layer4")
        .setAttribute("points", polygonPoints(panel4Points, left, top));
      document.getElementById("youtube-mask-layer5")
        .setAttribute("points", polygonPoints(panel5Points, left, top));
    }

    // Track Layer 3 and punch dynamic holes wherever foreground cards 4 and 5 overlap it.
    AFRAME.registerComponent("youtube-panel-tracker", {
      tick: function () {
        if (!youtubeOpen || !markerVisible || !scene.camera) {
          youtubeOverlay.style.display = "none";
          return;
        }

        scene.object3D.updateMatrixWorld(true);
        scene.camera.updateMatrixWorld(true);
        const canvasRect = scene.canvas.getBoundingClientRect();

        const panel3 = projectPanel("panel-3", 3.6, 2.0);
        const panel4 = projectPanel("panel-4", 5.2, 2.89);
        const panel5 = projectPanel("panel-5", 3.6, 2.0);

        if (!panel3 || !panel4 || !panel5 ||
            [...panel3, ...panel4, ...panel5].some(p => p.z < -1 || p.z > 1)) {
          youtubeOverlay.style.display = "none";
          return;
        }

        const xs = panel3.map(p => p.x);
        const ys = panel3.map(p => p.y);
        const left = Math.max(0, Math.min(...xs));
        const top = Math.max(0, Math.min(...ys));
        const right = Math.min(window.innerWidth, Math.max(...xs));
        const bottom = Math.min(window.innerHeight, Math.max(...ys));
        const width = right - left;
        const height = bottom - top;

        if (width < 48 || height < 30) {
          youtubeOverlay.style.display = "none";
          return;
        }

        youtubeOverlay.style.left = left + "px";
        youtubeOverlay.style.top = top + "px";
        youtubeOverlay.style.width = width + "px";
        youtubeOverlay.style.height = height + "px";

        // White = visible Layer 3 video. Black = transparent cut-outs
        // that reveal the real A-Frame foreground panels underneath.
        setMask(panel3, panel4, panel5, width, height, left, top);
        youtubeOverlay.style.display = "block";
      }
    });

    scene.addEventListener("loaded", () => {
      scene.setAttribute("youtube-panel-tracker", "");

      const panelOrder = {
        "panel-1": 1,
        "panel-2": 2,
        "panel-3": 3,
        "panel-4": 4,
        "panel-5": 5
      };

      Object.entries(panelOrder).forEach(([id, order]) => {
        const panel = document.getElementById(id);
        if (panel && panel.object3D) {
          panel.object3D.renderOrder = order;
          panel.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material.depthTest = true;
              node.material.depthWrite = false;
              node.material.needsUpdate = true;
            }
          });
        }
      });

      status.innerText = "Camera ready — scan marker";
    });
  </script>


</body>

</html>
