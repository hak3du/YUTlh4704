<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {

      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="portfolio1.jpg"
      >

      <img
        id="pic2"
        src="portfolio2.jpg"
      >

      <img
        id="pic3"
        src="portfolio3.jpg"
      >

      <img
        id="pic4"
        src="portfolio4.jpg"
      >

      <img
        id="pic5"
        src="portfolio5.jpg"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -0.60"

          width="1.8"

          height="1"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.45"

          width="1.8"

          height="1"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.30"

          width="1.8"

          height="1"

          material="
            src: #pic3;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.15"

          width="1.8"

          height="1"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="1.8"

          height="1"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const marker =
      document.querySelector("#marker");

    const status =
      document.querySelector("#status");

    const scene =
      document.querySelector("a-scene");


    /*
     * A-FRAME LOADED
     */

    scene.addEventListener(
      "loaded",
      function () {

        console.log("A-FRAME LOADED");

        status.innerText =
          "Camera ready — scan marker";

      }
    );


    /*
     * MARKER FOUND
     */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

      }
    );


    /*
     * MARKER LOST
     */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }
    );

  </script>


</body>

</html>
