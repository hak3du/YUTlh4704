```html
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Video</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>


<body>


<a-scene

  embedded

  vr-mode-ui="enabled: false"

  renderer="
    alpha: true;
    antialias: true;
  "

  arjs="
    sourceType: webcam;
    trackingMethod: best;
    debugUIEnabled: false;
  "
>


  <!-- ==============================
       VIDEO
       ============================== -->

  <a-assets>

    <video

      id="portfolioVideo"

      src="portfolio.mp4"

      loop

      muted

      playsinline

      webkit-playsinline

      crossorigin="anonymous"

    ></video>

  </a-assets>


  <!-- ==============================
       MARKER
       ============================== -->

  <a-marker

    id="marker"

    type="pattern"

    url="assets/marker.patt"
  >


    <!--
      THIS IS THE VIDEO.

      It is INSIDE the marker.

      Therefore it inherits the marker's
      position, rotation and scale.
    -->

    <a-video

      id="video"

      src="#portfolioVideo"

      width="2"

      height="1.125"

      position="0 0.5 0"

      rotation="-90 0 0"

    ></a-video>


  </a-marker>


  <!-- CAMERA -->

  <a-entity camera></a-entity>


</a-scene>



<script>


const marker =
  document.querySelector("#marker");


const video =
  document.querySelector("#portfolioVideo");


/*
========================================
MARKER FOUND
========================================
*/

marker.addEventListener(
  "markerFound",
  async function () {

    console.log("MARKER FOUND");

    try {

      await video.play();

      console.log("VIDEO PLAYING");

    }

    catch (error) {

      console.error(
        "VIDEO PLAY ERROR:",
        error
      );

    }

  }
);


/*
========================================
MARKER LOST
========================================
*/

marker.addEventListener(
  "markerLost",
  function () {

    console.log("MARKER LOST");

  }
);


</script>


</body>
</html>
```
