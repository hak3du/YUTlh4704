```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Portfolio AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    /*
      Floating video above the AR marker
    */

    #videoCard {

      position: fixed;

      width: min(72vw, 420px);
      aspect-ratio: 16 / 9;

      left: 50%;
      top: 35%;

      transform:
        translate(-50%, -50%)
        scale(0.85);

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);

      border: 2px solid rgba(255,255,255,0.8);

      z-index: 9999;

      display: none;

      /*
        Allows the iframe to receive
        touch interaction.
      */

      pointer-events: auto;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      opacity: 0;

    }


    #videoCard.visible {

      display: block;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

    }


    #youtube {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

    }


    /*
      Small AR label
    */

    #label {

      position: fixed;

      left: 50%;
      top: calc(35% + min(38vw, 225px));

      transform: translateX(-50%);

      z-index: 9999;

      display: none;

      padding: 7px 14px;

      border-radius: 20px;

      background: rgba(0,0,0,0.75);

      color: white;

      font-size: 13px;

      letter-spacing: 0.5px;

      pointer-events: none;

    }

  </style>
</head>


<body>


  <!-- =========================================
       FLOATING AR VIDEO
       ========================================= -->

  <div id="videoCard">

    <iframe
      id="youtube"

      src=""

      title="Portfolio Introduction"

      allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen
      "

      allowfullscreen>
    </iframe>

  </div>


  <div id="label">
    PORTFOLIO
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "

    renderer="
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    vr-mode-ui="enabled: false"

    loading-screen="enabled: false">


    <!-- =====================================
         AR MARKER
         ===================================== -->

    <a-marker

      id="marker"

      type="pattern"

      url="assets/marker.patt">

    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>


    /*
      ========================================
      CONFIGURATION
      ========================================
    */

    const VIDEO_ID = "YOUR_VIDEO_ID";


    /*
      DOM
    */

    const marker =
      document.querySelector("#marker");

    const videoCard =
      document.querySelector("#videoCard");

    const youtube =
      document.querySelector("#youtube");

    const label =
      document.querySelector("#label");


    /*
      ========================================
      SHOW VIDEO
      ========================================
    */

    function showVideo() {

      /*
        Load YouTube only after marker
        detection.

        This prevents the video from
        playing before AR starts.
      */

      youtube.src =
        `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&mute=0&playsinline=1`;

      videoCard.style.display = "block";

      label.style.display = "block";


      /*
        Allow CSS transition to run.
      */

      requestAnimationFrame(() => {

        videoCard.classList.add("visible");

      });

    }


    /*
      ========================================
      HIDE VIDEO
      ========================================
    */

    function hideVideo() {

      videoCard.classList.remove("visible");

      label.style.display = "none";


      /*
        Stop playback.

        Clearing the iframe also prevents
        audio continuing after marker loss.
      */

      setTimeout(() => {

        youtube.src = "";

        videoCard.style.display = "none";

      }, 250);

    }


    /*
      ========================================
      MARKER DETECTED
      ========================================
    */

    marker.addEventListener(
      "markerFound",
      () => {

        showVideo();

      }
    );


    /*
      ========================================
      MARKER LOST
      ========================================
    */

    marker.addEventListener(
      "markerLost",
      () => {

        hideVideo();

      }
    );


  </script>

</body>
</html>
```
