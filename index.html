<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Layers</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {

      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }

  </style>

</head>

<body>


  <!-- DEBUG -->

  <div id="status">
    Looking for marker...
  </div>


  <!-- AR SCENE -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- MARKER -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =========================================
           PORTFOLIO LAYER 1
           BACK
           ========================================= -->

      <a-plane

        position="0 0.50 -0.20"

        rotation="-90 0 0"

        width="1.8"

        height="1"

        color="#111"

        opacity="0.95"

      ></a-plane>


      <!-- =========================================
           PORTFOLIO LAYER 2
           ========================================= -->

      <a-plane

        position="0 0.50 -0.10"

        rotation="-90 0 0"

        width="1.75"

        height="0.95"

        color="#222"

        opacity="0.95"

      ></a-plane>


      <!-- =========================================
           PORTFOLIO LAYER 3
           MAIN
           ========================================= -->

      <a-plane

        position="0 0.50 0"

        rotation="-90 0 0"

        width="1.70"

        height="0.90"

        color="#333"

        opacity="0.95"

      ></a-plane>


      <!-- =========================================
           PORTFOLIO LAYER 4
           ========================================= -->

      <a-plane

        position="0 0.50 0.10"

        rotation="-90 0 0"

        width="1.65"

        height="0.85"

        color="#444"

        opacity="0.95"

      ></a-plane>


      <!-- =========================================
           PORTFOLIO LAYER 5
           FRONT
           ========================================= -->

      <a-plane

        position="0 0.50 0.20"

        rotation="-90 0 0"

        width="1.60"

        height="0.80"

        color="#555"

        opacity="0.95"

      ></a-plane>


      <!-- =========================================
           TITLE
           ========================================= -->

      <a-text

        value="PORTFOLIO"

        position="0 0.56 0.21"

        rotation="-90 0 0"

        align="center"

        width="3"

        color="white"

      ></a-text>


    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>

    const marker =
      document.querySelector("#marker");

    const status =
      document.querySelector("#status");


    marker.addEventListener(

      "markerFound",

      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

      }

    );


    marker.addEventListener(

      "markerLost",

      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }

    );


    document
      .querySelector("a-scene")
      .addEventListener(

        "loaded",

        function () {

          console.log("A-FRAME LOADED");

          status.innerText =
            "Camera ready — scan marker";

        }

      );

  </script>


</body>

</html>
