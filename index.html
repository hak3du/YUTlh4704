```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Video</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /*
      DEBUG STATUS
    */

    #status {
      position: fixed;
      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;
    }


    /*
      FLOATING VIDEO CARD
    */

    #videoCard {

      position: fixed;

      width: 70vw;
      max-width: 500px;

      aspect-ratio: 16 / 9;

      left: 50%;
      top: 32%;

      transform: translate(-50%, -50%);

      background: black;

      border-radius: 16px;

      overflow: hidden;

      border: 3px solid white;

      box-shadow:
        0 20px 60px rgba(0,0,0,.6);

      z-index: 9999;

      display: none;

    }


    #youtube {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

    }


    /*
      LABEL UNDER VIDEO
    */

    #label {

      position: fixed;

      left: 50%;
      top: calc(32% + 210px);

      transform: translateX(-50%);

      z-index: 9999;

      padding: 8px 16px;

      border-radius: 20px;

      background: rgba(0,0,0,.8);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 13px;

      display: none;

    }

  </style>
</head>


<body>


  <!-- DEBUG -->

  <div id="status">
    Looking for marker...
  </div>


  <!-- FLOATING VIDEO -->

  <div id="videoCard">

    <iframe
      id="youtube"

      title="Portfolio Video"

      src=""

      allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        fullscreen
      "

      allowfullscreen>
    </iframe>

  </div>


  <div id="label">
    PORTFOLIO VIDEO
  </div>


  <!-- ===================================
       AR SCENE
       =================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =================================
         MARKER
         ================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="assets/marker.patt"

    >

      <!--
        THIS IS A REAL AR OBJECT.

        It should appear directly above
        the physical marker.
      -->

      <a-plane

        position="0 0.5 0"

        rotation="-90 0 0"

        width="1.8"

        height="1"

        color="#111"

        opacity="0.9"

      >

      </a-plane>


      <!-- AR TITLE -->

      <a-text

        value="PORTFOLIO"

        position="0 0.55 0"

        rotation="-90 0 0"

        align="center"

        width="3"

        color="white"

      >

      </a-text>


    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>

    /*
      ======================================
      CONFIG
      ======================================
    */

    const VIDEO_ID = "YOUR_VIDEO_ID";


    /*
      ======================================
      ELEMENTS
      ======================================
    */

    const marker =
      document.querySelector("#marker");

    const videoCard =
      document.querySelector("#videoCard");

    const youtube =
      document.querySelector("#youtube");

    const label =
      document.querySelector("#label");

    const status =
      document.querySelector("#status");


    /*
      ======================================
      MARKER FOUND
      ======================================
    */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

        /*
          Show floating HTML video
        */

        videoCard.style.display = "block";

        label.style.display = "block";


        /*
          IMPORTANT:
          muted autoplay is much more
          likely to be permitted.
        */

        youtube.src =
          "https://www.youtube.com/embed/" +
          VIDEO_ID +
          "?autoplay=1&mute=1&playsinline=1";

      }
    );


    /*
      ======================================
      MARKER LOST
      ======================================
    */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";


        videoCard.style.display = "none";

        label.style.display = "none";

        youtube.src = "";

      }
    );


    /*
      ======================================
      AR READY
      ======================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(
        "loaded",
        function () {

          console.log("A-FRAME LOADED");

          status.innerText =
            "Camera ready — scan marker";

        }
      );

  </script>

</body>
</html>
```
