<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }

    /* YouTube is an HTML overlay projected onto Layer 3's tracked position. */
    #youtube-panel {
      position: fixed;
      display: none;
      z-index: 9000;
      overflow: hidden;
      background: #05080c;
      pointer-events: auto;
    }
    #youtube-panel iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>

  <div id="youtube-panel" aria-label="Layer 3 YouTube video">
    <iframe
      id="youtube-frame"
      title="Layer 3 video"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — TRACKED VIDEO PANEL
             YouTube playback is projected over this
             marker-attached plane by the overlay tracker.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="3.6"
          height="2"
          material="
            color: #05080c;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const videoPanel = document.querySelector("#panel-3");
    const youtubeOverlay = document.querySelector("#youtube-panel");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0";

    let markerVisible = false;
    let youtubeStarted = false;

    marker.addEventListener("markerFound", () => {
      markerVisible = true;
      status.innerText = "✓ MARKER DETECTED — portfolio stack active";
      if (!youtubeStarted) {
        youtubeFrame.src = YOUTUBE_EMBED;
        youtubeStarted = true;
      }
      youtubeOverlay.style.display = "block";
    });

    marker.addEventListener("markerLost", () => {
      markerVisible = false;
      youtubeOverlay.style.display = "none";
      youtubeFrame.src = "about:blank";
      youtubeStarted = false;
      status.innerText = "Marker lost — point camera at marker";
    });

    // Project the 3D panel's four corners into screen space each frame.
    // The YouTube iframe therefore tracks marker movement and scale.
    scene.addEventListener("loaded", () => {
      scene.setAttribute("youtube-panel-tracker", "");
    });

    AFRAME.registerComponent("youtube-panel-tracker", {
      tick: function () {
        if (!markerVisible || !scene.camera || !videoPanel.object3D) {
          youtubeOverlay.style.display = "none";
          return;
        }

        const mesh = videoPanel.getObject3D("mesh");
        if (!mesh) return;

        scene.object3D.updateMatrixWorld(true);
        scene.camera.updateMatrixWorld(true);

        const halfW = 1.8;
        const halfH = 1.0;
        const corners = [
          new THREE.Vector3(-halfW, -halfH, 0),
          new THREE.Vector3( halfW, -halfH, 0),
          new THREE.Vector3( halfW,  halfH, 0),
          new THREE.Vector3(-halfW,  halfH, 0)
        ];

        const rect = scene.canvas.getBoundingClientRect();
        const projected = corners.map((corner) => {
          mesh.localToWorld(corner);
          corner.project(scene.camera);
          return {
            x: rect.left + (corner.x + 1) * rect.width / 2,
            y: rect.top + (1 - corner.y) * rect.height / 2,
            z: corner.z
          };
        });

        if (projected.some(p => p.z < -1 || p.z > 1)) {
          youtubeOverlay.style.display = "none";
          return;
        }

        const xs = projected.map(p => p.x);
        const ys = projected.map(p => p.y);
        const left = Math.min(...xs);
        const top = Math.min(...ys);
        const width = Math.max(...xs) - left;
        const height = Math.max(...ys) - top;

        if (width < 40 || height < 24 ||
            left > window.innerWidth || top > window.innerHeight ||
            left + width < 0 || top + height < 0) {
          youtubeOverlay.style.display = "none";
          return;
        }

        youtubeOverlay.style.left = left + "px";
        youtubeOverlay.style.top = top + "px";
        youtubeOverlay.style.width = width + "px";
        youtubeOverlay.style.height = height + "px";
        youtubeOverlay.style.display = "block";
      }
    });

    document.querySelector("a-scene").addEventListener("loaded", () => {
      // Explicit transparent-panel ordering: back to front.
      // Larger renderOrder values are drawn later.
      const panelOrder = {
        "panel-1": 1,
        "panel-2": 2,
        "panel-3": 3,
        "panel-4": 4,
        "panel-5": 5
      };

      Object.entries(panelOrder).forEach(([id, order]) => {
        const panel = document.getElementById(id);
        if (panel && panel.object3D) {
          panel.object3D.renderOrder = order;
          panel.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material.depthTest = true;
              node.material.depthWrite = false;
              node.material.needsUpdate = true;
            }
          });
        }
      });

      status.innerText = "Camera ready — scan marker";
    });
  </script>


</body>

</html>
