<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Marker-projected Layer 3 YouTube overlay. */
    #video-launch { position:fixed; z-index:8000; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:10px; border:1px solid rgba(145,225,255,.68); border-radius:999px; padding:13px 21px; color:#eafaff; background:linear-gradient(135deg,rgba(8,28,44,.96),rgba(5,13,25,.96)); box-shadow:0 0 0 1px rgba(80,190,255,.12),0 8px 30px rgba(0,0,0,.38),0 0 22px rgba(0,170,255,.18); font:700 11px/1 Arial,sans-serif; letter-spacing:1.8px; text-transform:uppercase; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    #video-launch .play-mark { display:inline-grid; place-items:center; width:23px; height:23px; border:1px solid rgba(145,225,255,.72); border-radius:50%; color:#9beaff; font-size:10px; letter-spacing:0; }
    #video-overlay { position:fixed; z-index:9000; display:none; overflow:hidden; background:#000; border:1px solid rgba(155,220,255,.82); box-shadow:0 0 18px rgba(0,170,255,.22); box-sizing:border-box; }
    #youtube-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:#000; }
    #youtube-close { position:absolute; z-index:2; top:5px; right:5px; width:27px; height:27px; padding:0; border:1px solid rgba(210,240,255,.65); border-radius:5px; color:white; background:rgba(0,0,0,.72); font:19px/23px Arial,sans-serif; cursor:pointer; }
    @media (max-width:600px) { #video-launch { bottom:max(18px,env(safe-area-inset-bottom)); padding:12px 18px; font-size:10px; } #youtube-close { width:24px; height:24px; line-height:20px; } }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>
  <button id="video-launch" type="button" aria-label="Play portfolio video"><span class="play-mark">▶</span><span>Play Layer 03</span></button>
  <div id="video-overlay" aria-label="Layer 3 video">
    <iframe id="youtube-frame" title="Layer 3 video" src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <button id="youtube-close" type="button" aria-label="Stop video and restore layers">×</button>
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

      <img
        id="pic3"
        src="https://i.ytimg.com/vi/qGlJVZP9Ie8/hqdefault.jpg"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="6.8"

          height="3.78"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.80"

          width="4.6"

          height="2.56"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3 — VIDEO PANEL
             YouTube is projected over this marker plane.
             ===================================== -->
        <a-plane
          id="panel-3"
          position="0 0 -0.60"
          width="3.6"
          height="2"
          material="
            src: #pic3;
            shader: flat;
            transparent: true;
            opacity: 0.96;
            depthWrite: false;
            side: double;
          "
        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.40"

          width="5.2"

          height="2.89"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="3.6"

          height="2"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const videoOverlay = document.querySelector("#video-overlay");
    const youtubeFrame = document.querySelector("#youtube-frame");
    const youtubeClose = document.querySelector("#youtube-close");
    const videoLaunch = document.querySelector("#video-launch");
    const panel3 = document.querySelector("#panel-3");
    const stackPanels = ["#panel-1", "#panel-2", "#panel-4", "#panel-5"]
      .map(selector => document.querySelector(selector));
    const YOUTUBE_EMBED = "https://www.youtube-nocookie.com/embed/qGlJVZP9Ie8?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1";
    let markerVisible = false;
    let youtubeOpen = false;
    let animationFrame = 0;

    function setArtworkVisible(visible) {
      stackPanels.forEach(panel => panel.setAttribute("visible", visible));
      panel3.setAttribute("visible", !youtubeOpen);
    }

    function projectVideoPanel() {
      if (!youtubeOpen || !markerVisible || !scene.camera || !panel3.object3D) {
        videoOverlay.style.display = "none";
        return;
      }

      panel3.object3D.updateWorldMatrix(true, false);
      scene.camera.updateMatrixWorld(true);
      const halfW = 1.8;
      const halfH = 1.0;
      const corners = [
        new THREE.Vector3(-halfW, -halfH, 0),
        new THREE.Vector3( halfW, -halfH, 0),
        new THREE.Vector3( halfW,  halfH, 0),
        new THREE.Vector3(-halfW,  halfH, 0)
      ];

      const projected = corners.map(point => {
        point.applyMatrix4(panel3.object3D.matrixWorld);
        point.project(scene.camera);
        return {
          x: (point.x * 0.5 + 0.5) * window.innerWidth,
          y: (-point.y * 0.5 + 0.5) * window.innerHeight,
          z: point.z
        };
      });

      if (projected.some(point => point.z < -1 || point.z > 1)) {
        videoOverlay.style.display = "none";
        return;
      }

      const xs = projected.map(point => point.x);
      const ys = projected.map(point => point.y);
      const left = Math.max(0, Math.min(...xs));
      const top = Math.max(0, Math.min(...ys));
      const right = Math.min(window.innerWidth, Math.max(...xs));
      const bottom = Math.min(window.innerHeight, Math.max(...ys));

      if (right - left < 24 || bottom - top < 24) {
        videoOverlay.style.display = "none";
        return;
      }

      videoOverlay.style.left = left + "px";
      videoOverlay.style.top = top + "px";
      videoOverlay.style.width = (right - left) + "px";
      videoOverlay.style.height = (bottom - top) + "px";
      videoOverlay.style.display = "block";
    }

    function trackVideo() {
      if (!youtubeOpen) return;
      projectVideoPanel();
      animationFrame = requestAnimationFrame(trackVideo);
    }

    function openYoutube() {
      if (youtubeOpen) return;
      if (!markerVisible) {
        status.innerText = "Scan the marker first, then play Layer 03";
        return;
      }
      youtubeOpen = true;
      setArtworkVisible(false);
      youtubeFrame.src = YOUTUBE_EMBED;
      videoLaunch.style.display = "none";
      trackVideo();
      status.innerText = "✓ LAYER 03 VIDEO ACTIVE";
    }

    function closeYoutube() {
      if (!youtubeOpen) return;
      youtubeOpen = false;
      cancelAnimationFrame(animationFrame);
      youtubeFrame.src = "about:blank";
      videoOverlay.style.display = "none";
      setArtworkVisible(true);
      videoLaunch.style.display = "flex";
      status.innerText = markerVisible
        ? "✓ MARKER DETECTED"
        : "Marker lost — point camera at marker";
    }

    videoLaunch.addEventListener("click", openYoutube);
    youtubeClose.addEventListener("click", closeYoutube);

    marker.addEventListener("markerFound", function() {
      markerVisible = true;
      if (!youtubeOpen) status.innerText = "✓ MARKER DETECTED";
    });

    marker.addEventListener("markerLost", function() {
      markerVisible = false;
      if (youtubeOpen) closeYoutube();
      status.innerText = "Marker lost — point camera at marker";
    });

    scene.addEventListener("loaded", function() {
      status.innerText = "Camera ready — scan marker";
    });

    window.addEventListener("resize", function() {
      if (youtubeOpen) projectVideoPanel();
    });
  </script>


</body>

</html>
