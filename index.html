```html
<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portfolio AR Video</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }

  </style>

</head>


<body>


  <!-- =====================================
       VIDEO SOURCE
       ===================================== -->

  <video
    id="portfolioVideo"

    src="assets/portfolio.mp4"

    autoplay
    loop
    muted
    playsinline

    crossorigin="anonymous"

    style="display:none;">

  </video>



  <!-- =====================================
       AR SCENE
       ===================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: false;
    "

  >


    <!-- ===================================
         ASSETS
         =================================== -->

    <a-assets>

      <video
        id="videoTexture"

        src="assets/portfolio.mp4"

        autoplay
        loop
        muted
        playsinline

        crossorigin="anonymous">

      </video>

    </a-assets>



    <!-- ===================================
         MARKER
         =================================== -->

    <a-marker

      id="marker"

      type="pattern"

      url="assets/marker.patt"
    >


      <!-- =================================
           VIDEO
           ================================= -->

      <a-video

        id="videoPlane"

        src="#videoTexture"

        width="1.8"

        height="1.0125"

        position="0 0.5 0"

        rotation="-90 0 0"

      >
      </a-video>



      <!-- =================================
           OPTIONAL TITLE
           ================================= -->

      <a-text

        value="PORTFOLIO"

        position="0 0.05 0"

        rotation="-90 0 0"

        align="center"

        width="2"

        color="white"

      >
      </a-text>


    </a-marker>



    <!-- ===================================
         CAMERA
         =================================== -->

    <a-entity camera></a-entity>


  </a-scene>



  <script>


    const marker =
      document.querySelector("#marker");


    const video =
      document.querySelector("#videoTexture");


    /*
      ======================================
      MARKER FOUND
      ======================================
    */

    marker.addEventListener(
      "markerFound",
      () => {

        console.log("MARKER FOUND");

        video.play().catch(
          error => {

            console.log(
              "Video playback requires interaction:",
              error
            );

          }
        );

      }
    );


    /*
      ======================================
      MARKER LOST
      ======================================
    */

    marker.addEventListener(
      "markerLost",
      () => {

        console.log("MARKER LOST");

      }
    );


  </script>


</body>

</html>
```
