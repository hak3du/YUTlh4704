<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — 3D Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /* =========================================
       DEBUG STATUS
       ========================================= */

    #status {

      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0, 0, 0, 0.75);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG
       ========================================= -->

  <div id="status">
    Looking for marker...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =======================================
           TRUE 3D PORTFOLIO STACK

           The rotation happens ONCE here.

           Every panel below has:
             - identical width
             - identical height
             - identical rotation

           Only Z changes.

           This creates physical depth.
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PANEL 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -0.60"

          width="1.8"

          height="1"

          color="#111111"

          opacity="0.95"

        ></a-plane>


        <!-- =====================================
             PANEL 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.45"

          width="1.8"

          height="1"

          color="#222222"

          opacity="0.95"

        ></a-plane>


        <!-- =====================================
             PANEL 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.30"

          width="1.8"

          height="1"

          color="#333333"

          opacity="0.95"

        ></a-plane>


        <!-- =====================================
             PANEL 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.15"

          width="1.8"

          height="1"

          color="#444444"

          opacity="0.95"

        ></a-plane>


        <!-- =====================================
             PANEL 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="1.8"

          height="1"

          color="#555555"

          opacity="0.95"

        ></a-plane>


        <!-- =====================================
             FRONT TITLE
             ===================================== -->

        <a-text

          id="portfolio-title"

          value="PORTFOLIO"

          position="0 0.01 0.01"

          rotation="0 0 0"

          align="center"

          width="3"

          color="#FFFFFF"

        ></a-text>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity camera></a-entity>


  </a-scene>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    /*
      ==========================================
      ELEMENTS
      ==========================================
    */

    const marker =
      document.querySelector("#marker");


    const status =
      document.querySelector("#status");


    /*
      ==========================================
      MARKER FOUND
      ==========================================
    */

    marker.addEventListener(

      "markerFound",

      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

      }

    );


    /*
      ==========================================
      MARKER LOST
      ==========================================
    */

    marker.addEventListener(

      "markerLost",

      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }

    );


    /*
      ==========================================
      A-FRAME READY
      ==========================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(

        "loaded",

        function () {

          console.log("A-FRAME LOADED");

          status.innerText =
            "Camera ready — scan marker";

        }

      );


  </script>


</body>

</html>
