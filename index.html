<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10000;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    #youtube-player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.88);
      box-sizing: border-box;
    }

    #youtube-player.open {
      display: flex;
    }

    #youtube-player .player-card {
      width: min(900px, 100%);
      position: relative;
      background: #000;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    #youtube-player .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: 0;
    }

    #close-youtube {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.8);
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="portfolio1.png"
      >

      <img
        id="pic2"
        src="portfolio2.png"
      >

      <!-- YouTube thumbnail used as the AR panel texture.
           Tap/click the panel to open the actual YouTube player. -->
      <img
        id="pic3"
        src="https://img.youtube.com/vi/Qj0Qx8HpNUo/hqdefault.jpg"
        crossorigin="anonymous"
      >

      <img
        id="pic4"
        src="portfolio4.png"
      >

      <img
        id="pic5"
        src="portfolio5.png"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -0.60"

          width="1.8"

          height="1"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.45"

          width="1.8"

          height="1"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.30"

          width="1.8"

          height="1"

          material="
            src: #pic3;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.15"

          width="1.8"

          height="1"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="1.8"

          height="1"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity camera>
      <a-entity
        cursor="fuse: false; rayOrigin: entity"
        raycaster="objects: #panel-3; far: 10"
        position="0 0 -1">
      </a-entity>
    </a-entity>


  </a-scene>


  <!-- YouTube player opened when the middle AR panel is tapped. -->
  <div id="youtube-player" role="dialog" aria-modal="true" aria-label="Portfolio video">
    <div class="player-card">
      <button id="close-youtube" type="button" aria-label="Close video">×</button>
      <iframe
        id="youtube-iframe"
        class="video-frame"
        title="Portfolio introduction video"
        src="about:blank"
        data-src="https://www.youtube-nocookie.com/embed/Qj0Qx8HpNUo?autoplay=1&rel=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const marker =
      document.querySelector("#marker");

    const status =
      document.querySelector("#status");

    const scene =
      document.querySelector("a-scene");
    const middlePanel =
      document.querySelector("#panel-3");
    const youtubePlayer =
      document.querySelector("#youtube-player");
    const youtubeIframe =
      document.querySelector("#youtube-iframe");
    const closeYoutube =
      document.querySelector("#close-youtube");

    function openYoutube() {
      youtubeIframe.src = youtubeIframe.dataset.src;
      youtubePlayer.classList.add("open");
      status.innerText = "Playing portfolio video";
    }

    function closeYoutubePlayer() {
      youtubePlayer.classList.remove("open");
      youtubeIframe.src = "about:blank";
      status.innerText = marker.object3D.visible
        ? "✓ MARKER DETECTED"
        : "Camera ready — scan marker";
    }

    middlePanel.addEventListener("click", openYoutube);
    closeYoutube.addEventListener("click", closeYoutubePlayer);
    youtubePlayer.addEventListener("click", function (event) {
      if (event.target === youtubePlayer) closeYoutubePlayer();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeYoutubePlayer();
    });


    /*
     * A-FRAME LOADED
     */

    scene.addEventListener(
      "loaded",
      function () {

        console.log("A-FRAME LOADED");

        status.innerText =
          "Camera ready — scan marker";

      }
    );


    /*
     * MARKER FOUND
     */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";

      }
    );


    /*
     * MARKER LOST
     */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";

      }
    );

  </script>


</body>

</html>
