```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio Video</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 15px;

      z-index: 10000;

      padding: 10px 14px;

      border-radius: 8px;

      background: rgba(0,0,0,.75);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /*
      YouTube player is positioned over
      the AR video surface.
    */

    #youtubePlayer {

      position: fixed;

      width: 70vw;
      max-width: 500px;

      aspect-ratio: 16 / 9;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 9999;

      display: none;

      border: 0;

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 15px 40px rgba(0,0,0,.5);

    }

  </style>
</head>


<body>


  <!-- DEBUG -->

  <div id="status">
    Looking for marker...
  </div>


  <!-- ===================================
       YOUTUBE
       =================================== -->

  <iframe

    id="youtubePlayer"

    src=""

    allow="
      autoplay;
      encrypted-media;
      picture-in-picture;
      fullscreen
    "

    allowfullscreen>

  </iframe>


  <!-- ===================================
       AR SCENE
       =================================== -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =================================
         MARKER
         ================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

    >

      <!--

        THIS IS THE SAME ANCHOR POSITION
        AS YOUR ORIGINAL VIDEO.

      -->

      <a-plane

        id="videoAnchor"

        position="0 0.5 0"

        rotation="-90 0 0"

        width="1.8"

        height="1.0125"

        visible="false"

      ></a-plane>


    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>


  </a-scene>


  <script>


    /*
      ======================================
      PUT YOUR YOUTUBE VIDEO ID HERE
      ======================================
    */

    const VIDEO_ID =
      "YOUR_VIDEO_ID";


    /*
      ======================================
      ELEMENTS
      ======================================
    */

    const marker =
      document.querySelector("#marker");

    const anchor =
      document.querySelector("#videoAnchor");

    const youtube =
      document.querySelector("#youtubePlayer");

    const status =
      document.querySelector("#status");


    /*
      ======================================
      MARKER FOUND
      ======================================
    */

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("MARKER FOUND");

        status.innerText =
          "✓ MARKER DETECTED";


        /*
          Start YouTube.

          muted=1 is important because
          mobile browsers normally block
          autoplay with sound.
        */

        youtube.src =
          "https://www.youtube.com/embed/" +
          VIDEO_ID +
          "?autoplay=1&mute=1&playsinline=1";


        youtube.style.display =
          "block";

      }
    );


    /*
      ======================================
      MARKER LOST
      ======================================
    */

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("MARKER LOST");

        status.innerText =
          "Marker lost — point camera at marker";


        youtube.style.display =
          "none";

        youtube.src = "";

      }
    );


    /*
      ======================================
      AR READY
      ======================================
    */

    document
      .querySelector("a-scene")
      .addEventListener(
        "loaded",
        function () {

          console.log("A-FRAME LOADED");

          status.innerText =
            "Camera ready — scan marker";

        }
      );


  </script>

</body>
</html>
```
