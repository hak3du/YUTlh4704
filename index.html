<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>AR Portfolio — Evidence Stack</title>


  <!-- =========================================
       A-FRAME
       ========================================= -->

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>


  <!-- =========================================
       AR.JS
       ========================================= -->

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>


  <!-- =========================================
       STYLE
       ========================================= -->

  <style>html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    #status {
      position: fixed; top: 15px; left: 15px; z-index: 10000;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: white;
      font-family: Arial, sans-serif; font-size: 14px;
    }
    /* Marker-locked hologram video: the camera feed remains the full-screen background. */
    #youtube-panel {
      position: fixed; left: 0; top: 0; width: 1280px; height: 720px;
      display: none; z-index: 9000; overflow: hidden; pointer-events: auto;
      background: #02070b; border: 1px solid rgba(65,235,255,.85);
      box-shadow: 0 0 24px rgba(0,225,255,.35);
      transform-origin: 0 0; will-change: transform;
    }
    #youtube-frame { display:block; width:100%; height:100%; border:0; background:#02070b; }
    #status { max-width:calc(100vw - 40px); }
  </style>

</head>


<body>


  <!-- =========================================
       DEBUG STATUS
       ========================================= -->

  <div id="status">
    Starting AR...
  </div>


  <!-- =========================================
       AR SCENE
       ========================================= -->

  <a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="
      antialias: true;
      alpha: true;
    "

    arjs="
      sourceType: webcam;
      trackingMethod: best;
      debugUIEnabled: true;
    "

  >


    <!-- =========================================
         IMAGE ASSETS
         ========================================= -->

    <a-assets>

      <img
        id="pic1"
        src="https://images.pexels.com/photos/4439901/pexels-photo-4439901.jpeg?auto=compress&cs=tinysrgb&w=2560"
        crossorigin="anonymous"
      >

      <img
        id="pic2"
        src="https://images.pexels.com/photos/34804019/pexels-photo-34804019.jpeg?auto=compress&cs=tinysrgb&w=1600"
        crossorigin="anonymous"
      >
<img
        id="pic4"
        src="./portfolio4.png"
        crossorigin="anonymous"
      >

      <img
        id="pic5"
        src="./portfolio5.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================================
         MARKER
         ========================================= -->

    <a-marker

      id="marker"

      type="pattern"

      url="marker.patt"

      smooth="true"

      smoothCount="5"

      smoothTolerance="0.01"

      smoothThreshold="2"

    >


      <!-- =======================================
           PORTFOLIO 3D STACK

           Everything inside this entity is
           physically attached to the marker.

           Move marker:
             → stack moves

           Rotate marker:
             → stack rotates

           Tilt marker:
             → stack tilts

           Move marker closer:
             → stack appears larger

           Move marker away:
             → stack appears smaller
           ======================================= -->

      <a-entity

        id="portfolio-stack"

        position="0 0.5 0"

        rotation="-90 0 0"

      >


        <!-- =====================================
             PORTFOLIO 1 — BACK
             ===================================== -->

        <a-plane

          id="panel-1"

          position="0 0 -1.20"

          width="5.85"

          height="3.25"

          material="
            src: #pic1;
            shader: flat;
            transparent: true;
            opacity: 1.0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 2
             ===================================== -->

        <a-plane

          id="panel-2"

          position="0 0 -0.90"

          width="3.6"

          height="2"

          material="
            src: #pic2;
            shader: flat;
            transparent: true;
            opacity: 0.8;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 3
             ===================================== -->

        <a-plane

          id="panel-3"

          position="0 0 -0.60"

          width="2.25"

          height="1.25"

          material="
            shader: flat;
            transparent: true;
            opacity: 0;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 4
             ===================================== -->

        <a-plane

          id="panel-4"

          position="0 0 -0.30"

          width="4.2"

          height="2.33"

          material="
            src: #pic4;
            shader: flat;
            transparent: true;
            opacity: 0.5;
            depthWrite: false;
          "

        ></a-plane>


        <!-- =====================================
             PORTFOLIO 5 — FRONT
             ===================================== -->

        <a-plane

          id="panel-5"

          position="0 0 0"

          width="2.7"

          height="1.5"

          material="
            src: #pic5;
            shader: flat;
            transparent: true;
            opacity: 0.85;
            depthWrite: false;
          "

        ></a-plane>


      </a-entity>


    </a-marker>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <a-entity id="ar-camera" camera>
      <a-entity
        cursor="fuse: false; rayOrigin: entity"
        raycaster="objects: #panel-3; far: 10"
        position="0 0 -1">
      </a-entity>
    </a-entity>


  </a-scene>


  <!-- YouTube iframe overlay follows panel 3 in screen space (legacy layout). -->
  <div id="youtube-panel" aria-label="Intro video panel">
    <iframe id="youtube-frame" title="Portfolio introduction video"
      src="https://www.youtube-nocookie.com/embed/hSNLuPRiWWA?autoplay=0&mute=1&playsinline=1&controls=1&rel=0&enablejsapi=1&origin=https%3A%2F%2Fhak3du.github.io"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
  <script>
    const marker = document.querySelector("#marker");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");
    const panel = document.querySelector("#panel-3");
    const overlay = document.querySelector("#youtube-panel");
    const frame = document.querySelector("#youtube-frame");
    let markerVisible = false;

    // Solve a projective homography from the panel's four 3D-projected corners
    // to the four corners of the YouTube iframe. This warps the player into
    // the tracked panel's perspective without replacing the live camera view.
    function solveLinearSystem(A, b) {
      const n = b.length;
      const m = A.map((row, i) => [...row, b[i]]);
      for (let col = 0; col < n; col++) {
        let pivot = col;
        for (let row = col + 1; row < n; row++) {
          if (Math.abs(m[row][col]) > Math.abs(m[pivot][col])) pivot = row;
        }
        if (Math.abs(m[pivot][col]) < 1e-10) return null;
        [m[col], m[pivot]] = [m[pivot], m[col]];
        const divisor = m[col][col];
        for (let j = col; j <= n; j++) m[col][j] /= divisor;
        for (let row = 0; row < n; row++) {
          if (row === col) continue;
          const factor = m[row][col];
          for (let j = col; j <= n; j++) m[row][j] -= factor * m[col][j];
        }
      }
      return m.map(row => row[n]);
    }

    function homographyForQuad(points, width, height) {
      const source = [[0,0], [width,0], [width,height], [0,height]];
      const A = [], b = [];
      source.forEach(([x,y], i) => {
        const {x:u, y:v} = points[i];
        A.push([x,0,y,0,1,0,-u*x,-u*y]); b.push(u);
        A.push([0,x,0,y,0,1,-v*x,-v*y]); b.push(v);
      });
      const h = solveLinearSystem(A,b);
      if (!h) return null;
      const [a,b1,c,d,e,f,g,k] = h;
      return `matrix3d(${a},${b1},0,${g},${c},${d},0,${k},0,0,1,0,${e},${f},0,1)`;
    }

    function projectPanel() {
      if (!markerVisible || !scene.camera || !scene.renderer || !panel.getObject3D("mesh")?.geometry) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }
      const rect = scene.renderer.domElement.getBoundingClientRect();
      const camera = scene.camera;
      const w = Number(panel.getAttribute("width")) || 2.25;
      const h = Number(panel.getAttribute("height")) || 1.25;
      panel.object3D.updateWorldMatrix(true, false);
      camera.updateMatrixWorld(true);

      // CSS source order: top-left, top-right, bottom-right, bottom-left.
      const localCorners = [[-w/2,h/2,0],[w/2,h/2,0],[w/2,-h/2,0],[-w/2,-h/2,0]];
      const points = localCorners.map(([x,y,z]) => {
        const p = new THREE.Vector3(x,y,z);
        panel.object3D.localToWorld(p);
        p.project(camera);
        return {
          x: rect.left + (p.x + 1) * rect.width / 2,
          y: rect.top + (1 - p.y) * rect.height / 2,
          z: p.z
        };
      });

      if (points.some(p => !Number.isFinite(p.x) || !Number.isFinite(p.y) || !Number.isFinite(p.z) || p.z < -1 || p.z > 1)) {
        overlay.style.display = "none";
        requestAnimationFrame(projectPanel);
        return;
      }
      const matrix = homographyForQuad(points, 1280, 720);
      if (!matrix) {
        overlay.style.display = "none";
      } else {
        overlay.style.display = "block";
        overlay.style.transform = matrix;
      }
      requestAnimationFrame(projectPanel);
    }

    function postYouTubeCommand(func) {
      frame.contentWindow?.postMessage(
        JSON.stringify({event:"command",func,args:[]}),
        "https://www.youtube-nocookie.com"
      );
    }

    marker.addEventListener("markerFound", () => {
      markerVisible = true;
      status.innerText = "✓ HOLOGRAM LOCKED — move your phone to view it from different angles";
      // Playback remains user-controlled inside the hologram for mobile autoplay compatibility.
    });

    marker.addEventListener("markerLost", () => {
      markerVisible = false;
      overlay.style.display = "none";
      status.innerText = "Marker lost — point camera at the marker";
      postYouTubeCommand("pauseVideo");
    });

    scene.addEventListener("loaded", () => {
      status.innerText = "Camera ready — scan the marker to reveal the hologram";
      requestAnimationFrame(projectPanel);
    });
  </script>


</body>

</html>
